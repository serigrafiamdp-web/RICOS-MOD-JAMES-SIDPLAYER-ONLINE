# TEST128 clean deployment: TOP 100 DEMOS and HVSC FIX data, no UI changes.
name: SpotySid Pages (static deployment)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spotysid-pages.yml'
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'community/**'
      - 'library/**'
      - 'images/**'
      - 'sids/**'
      - 'waveforms/**'
      - 'old/**'
      - 'src/**'
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: spotysid-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out published source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
