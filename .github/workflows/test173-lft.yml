name: TEST173 isolated LFT WASM smoke
on:
  push:
    branches: [test173-lft-mode-isolated]
    paths:
      - 'js/lft-wasm/**'
      - 'js/lft-mode.experimental.js'
      - 'scripts/test-lft-wasm.mjs'
      - 'scripts/test-lft-browser.mjs'
      - '.github/workflows/test173-lft.yml'
  workflow_dispatch:
jobs:
  test-lft-sids:
    name: LFT reference PCM via isolated WASM
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check WebAssembly engine
        run: node scripts/test-lft-wasm.mjs
      - name: Install Chromium for isolated smoke
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Check isolated browser audio and TinySID restoration
        run: node scripts/test-lft-browser.mjs
