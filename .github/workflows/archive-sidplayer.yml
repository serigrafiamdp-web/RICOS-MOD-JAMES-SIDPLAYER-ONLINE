name: Preserve original Jojati SID Player

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/archive-sidplayer.yml'

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original public website and published source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website upstream-source
          wget --recursive --level=4 --page-requisites --convert-links --adjust-extension --no-parent --no-host-directories --directory-prefix=mirror --domains=level3.jojati.com --timeout=25 --tries=2 https://level3.jojati.com/sidplayer/ || true
          if [ -d mirror/sidplayer ]; then cp -a mirror/sidplayer/. website/; fi
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 180 --output upstream-source/sidplayersrc.zip https://level3.jojati.com/sidplayer/src/sidplayersrc.zip || true
          if [ -s upstream-source/sidplayersrc.zip ]; then
            unzip -t upstream-source/sidplayersrc.zip >/dev/null || rm -f upstream-source/sidplayersrc.zip
          fi
          printf 'Preservation results: files in website: '
          find website -type f | wc -l
          find website -type f | sort | head -80
          printf 'Source zip: '
          ls -lh upstream-source/ || true
          test -s website/index.html || { echo 'Main HTML was not recovered; workflow will not publish partial mirror'; exit 1; }
      - name: Keep source and mirror in repository
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # Preserve the branded root page; collect files referenced dynamically by the player.
          python3 - <<'PY'
          import re, urllib.request, pathlib, urllib.parse, time
          source = pathlib.Path('js/sidPlayer.js').read_text(encoding='utf-8')
          base = 'https://level3.jojati.com/sidplayer/'
          groups = {
              'sids': sorted(set(re.findall(r'file:\s*"([^"]+\.sid)"', source, re.I))),
              'images': sorted(set(re.findall(r'image:\s*"([^"]+\.(?:gif|png|jpg))"', source, re.I))),
          }
          for folder, names in groups.items():
              pathlib.Path(folder).mkdir(exist_ok=True)
              for name in names:
                  if '/' in name or '..' in name: continue
                  target = pathlib.Path(folder, name)
                  if target.exists(): continue
                  url = urllib.parse.urljoin(base, folder + '/' + urllib.parse.quote(name))
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (archival mirror)'})
                      with urllib.request.urlopen(req, timeout=35) as resp:
                          data = resp.read()
                      if folder == 'images' and not (data[:6] in (b'GIF87a', b'GIF89a') or data.startswith((bytes.fromhex('89504e47'), bytes.fromhex('ffd8')))):
                          raise ValueError('not a SID file')
                      if folder == 'images' and not (data[:6] in (b'GIF87a', b'GIF89a') or data.startswith((bytes.fromhex('89504e47'), bytes.fromhex('ffd8')))):
                          raise ValueError('not a valid image')
                      target.write_bytes(data)
                      print('OK',target,len(data))
                  except Exception as exc:
                      print('MISSING',url,str(exc))
              print(folder,'retrieved:',len(list(pathlib.Path(folder).iterdir())),'expected:',len(names))
          PY
          git add -A website upstream-source sids images
          git add -A . ':!.github'
          if ! git diff --cached --quiet; then
            git commit -m 'Archive original Jojati SID Player web assets and upstream source'
            git push
          fi
